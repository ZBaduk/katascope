# KataGo analysis config for katascope.
#
# Purpose: make the engine's neural-net evaluation REPRODUCIBLE, so the Python
# activation service can be compared against it numerically. A default KataGo
# config is not reproducible -- it picks a random board symmetry per evaluation
# and may average several at the root, so the same position gives slightly
# different policy and ownership on every run.
#
# Every setting below that exists for determinism is marked. If you copy this
# for general play, those are the ones to drop.

logDir = analysis_logs
logAllRequests = false
logAllResponses = false
logSearchInfo = false
logToStderr = false

# Winrate and OWNERSHIP are both reported from this perspective. Side-to-move
# matches what the neural net's heads actually predict, which is what katascope
# compares against. The stock analysis_example.cfg uses BLACK.
reportAnalysisWinratesAs = SIDETOMOVE

# Determinism: one thread, so tree traversal order cannot vary.
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 1

# Determinism: no random symmetry per neural-net evaluation. This is the big
# one -- with nnRandomize on, each eval uses one of 8 dihedral transforms and
# policy/ownership differ run to run.
nnRandomize = false
nnRandSeed = katascope-deterministic

# Determinism: evaluate the root with exactly one symmetry (the identity) and
# do not prune by symmetry. These match KataGo's built-in defaults; stated
# explicitly because the golden test depends on them.
rootNumSymmetriesToSample = 1
rootSymmetryPruning = false

# Determinism and precision: force FP32. On Metal and CUDA the engine would
# otherwise use FP16, which costs roughly three decimal digits against the
# float32 PyTorch reference and would force a much looser golden tolerance.
useFP16 = false

# Feed the network the move history the position actually has.
#
# The analysis engine defaults `ignorePreRootHistory` to TRUE
# (Setup::DEFAULT_ANALYSIS_IGNORE_PRE_ROOT_HISTORY), which sets maxHistory = 0
# for the root evaluation -- so the reported policy and ownership are computed
# with no history planes at all, however many moves the query supplied. That is
# reasonable for analysing a position on its own merits, and wrong for comparing
# against a forward pass that encodes the history it was given.
ignorePreRootHistory = false
ignoreAllHistory = false

# The reported `policy` must be the network's own policy head, not a blend.
#
# For analysis, KataGo defaults `policyOptimism` to 1.0 and `rootPolicyOptimism`
# to min(that, 0.2), which geometrically interpolates the raw policy toward the
# net's *optimistic* policy head. The result is visibly flatter than the raw
# policy -- on a 9x9 fixture the peak moved from 0.48 to 0.35 -- and it is not
# what a PyTorch forward pass produces. Both must be zero to compare the two.
policyOptimism = 0.0
rootPolicyOptimism = 0.0

# Search is irrelevant here -- katascope asks for raw-net output at one visit.
maxVisits = 1
nnMaxBatchSize = 1
nnCacheSizePowerOfTwo = 16
nnMutexPoolSizePowerOfTwo = 12
