name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Angular 22's CLI refuses to start below this. Keep in step with .nvmrc.
  NODE_VERSION: '22.23.1'

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck every workspace, sources and tests
        run: npm run typecheck

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # test:ci excludes **/*.katago.spec.ts by glob. Those also skip on their
      # own when no binary is configured, which is always true here -- the
      # exclusion makes "CI never runs live-engine tests" deliberate rather
      # than a side effect of the runner having no KataGo.
      - name: core, katago-bridge and ui
        run: npm run test:ci

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Libraries, renderer and Electron bundles
        run: npm run build

  e2e:
    name: e2e smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Electron needs a display and the system libraries Chromium links
      # against. Playwright drives Electron's own binary, so no browser
      # download is needed -- only the libraries.
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Run the smoke test under a virtual display
        run: xvfb-run --auto-servernum npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  python:
    name: activation-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/activation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/activation-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Every test here skips without a katago binary and a model, neither of
      # which CI has. The suite still runs: collection errors, import errors and
      # syntax errors are real failures and this is what catches them.
      - name: pytest (katago-gated tests skip)
        run: python -m pytest -ra
      - name: Fail if the suite silently collected nothing
        run: python -m pytest --collect-only -q | tail -1 | grep -qE '[0-9]+ tests? collected'
